<h2>Tambah akun pengguna</h2>
<p class="sub">Buat akun Mahasiswa atau Admin Lab. Semua kolom wajib diisi.</p>
<form id="fAkun" class="card" novalidate style="max-width:680px">
 <label for="role">Peran</label>
 <select id="role" name="role"><option value="">Pilih peran</option><option value="mahasiswa">Mahasiswa</option><option value="adminlab">Admin Lab</option></select><p class="err" id="e_role"></p>
 <div class="row"><div><label for="nama">Nama lengkap</label><input id="nama" name="nama" autocomplete="off"><p class="err" id="e_nama"></p></div>
 <div><label for="username">Username (NIM / ID)</label><input id="username" name="username" autocomplete="off"><p class="err" id="e_username"></p></div></div>
 <div class="row"><div id="boxKelas"><label for="kelas">Kelas</label><select id="kelas" name="kelas"><option value="">Pilih kelas</option><option>A</option><option>B</option><option>C</option><option>D</option><option>I</option></select><p class="err" id="e_kelas"></p></div>
 <div><label for="angkatan">Angkatan</label><input id="angkatan" name="angkatan" type="number" value="2025"><p class="err" id="e_angkatan"></p></div></div>
 <label for="no_hp">No. HP</label><input id="no_hp" name="no_hp" inputmode="tel" placeholder="08xxxxxxxxxx"><p class="err" id="e_no_hp"></p>
 <div class="row"><div><label for="password">Password sementara</label><input id="password" name="password" type="password" autocomplete="new-password"><div class="meter"><i id="kuat"></i></div><p class="err" id="e_password"></p></div>
 <div><label for="ulang">Ulangi password</label><input id="ulang" type="password" autocomplete="new-password"><p class="err" id="e_ulang"></p></div></div>
 <p><button class="btn" type="submit">Simpan akun</button> <a class="btn alt" href="#log" data-page="log">Batal</a></p>
 <div id="hasil" role="status"></div>
</form>
